<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubs Jobs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f2; --surface: #fff; --border: #e4e2dc; --border-strong: #c8c5bc;
    --text: #1a1a18; --muted: #6b6a65; --faint: #9e9c97;
    --accent: #2563eb; --accent-bg: #eff4ff; --accent-border: #bfcffd;
    --green: #16a34a; --green-bg: #f0fdf4; --green-border: #bbf7d0;
    --amber: #b45309; --amber-bg: #fffbeb;
    --red: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
    --r: 10px; --rs: 6px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }

  /* HEADER */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 20; }
  .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-icon svg { width: 16px; height: 16px; }
  .brand-name { font-size: 15px; font-weight: 600; }
  .brand-sub { font-size: 11px; color: var(--muted); }
  .ptags { display: flex; gap: 5px; flex-wrap: wrap; }
  .ptag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); font-weight: 500; }

  /* LAYOUT */
  main { max-width: 960px; margin: 0 auto; padding: 1.25rem 1.5rem; display: grid; grid-template-columns: 250px 1fr; gap: 1.25rem; align-items: start; }

  /* SIDEBAR */
  .sidebar { position: sticky; top: 68px; display: flex; flex-direction: column; gap: 10px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem; }
  .panel-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }

  /* TOGGLES */
  .toggle-list { display: flex; flex-direction: column; gap: 5px; }
  .toggle-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; cursor: pointer; }
  .toggle-label { font-size: 13px; color: var(--text); user-select: none; }
  .toggle-switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track { position: absolute; inset: 0; background: var(--border); border-radius: 20px; transition: background 0.2s; }
  .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform 0.2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle-switch input:checked ~ .toggle-track { background: var(--accent); }
  .toggle-switch input:checked ~ .toggle-thumb { transform: translateX(16px); }

  /* SELECTS */
  .select-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .select-group:last-child { margin-bottom: 0; }
  .select-label { font-size: 11px; color: var(--muted); font-weight: 500; }
  select { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--rs); font-size: 13px; background: var(--surface); color: var(--text); appearance: none; cursor: pointer; }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  /* BUTTONS */
  .btn-search { width: 100%; padding: 9px; border-radius: var(--rs); background: var(--accent); color: #fff; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn-search:hover { opacity: 0.88; }
  .btn-search:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-clear { width: 100%; padding: 7px; border-radius: var(--rs); background: transparent; color: var(--muted); border: 1px solid var(--border); font-size: 13px; cursor: pointer; }
  .btn-clear:hover { background: var(--bg); }
  .btn-debug { width: 100%; padding: 6px; border-radius: var(--rs); background: transparent; color: var(--faint); border: 1px solid var(--border); font-size: 11px; cursor: pointer; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .tab { padding: 7px 14px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; user-select: none; display: flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-count { font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px; font-weight: 500; color: var(--muted); }
  .tab.active .tab-count { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  /* GROUP NAV */
  .group-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
  .group-pill { font-size: 12px; padding: 4px 11px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; text-decoration: none; white-space: nowrap; transition: all 0.1s; display: inline-block; }
  .group-pill:hover, .group-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .group-pill strong { font-weight: 600; }

  /* RESULTS */
  .results-col { min-width: 0; }
  .results-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .results-count { font-size: 14px; font-weight: 500; }
  .status-bar { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .sort-select { padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--rs); font-size: 12px; background: var(--surface); color: var(--text); appearance: none; cursor: pointer; }

  /* GROUPS */
  .group-section { margin-bottom: 22px; }
  .group-heading { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .group-count { font-weight: 400; }

  /* JOB CARDS */
  .job-list { display: flex; flex-direction: column; gap: 8px; }
  .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; transition: border-color 0.12s; }
  .job-card:hover { border-color: var(--border-strong); }
  .job-card.best-match { }
  .job-card.archived-card { opacity: 0.6; }
  .card-main { padding: .875rem 1rem .75rem; cursor: pointer; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 2px; }
  .card-org { font-size: 12px; color: var(--muted); }
  .card-top-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .source-badge { font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .source-adzuna { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  .source-reed   { background: #fdf2f8; color: #9d174d; border: 1px solid #fbcfe8; }
  .source-jooble { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .btn-dismiss { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--faint); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; transition: all 0.15s; flex-shrink: 0; }
  .btn-dismiss:hover { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
  .btn-restore { font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .btn-restore:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .card-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .meta-chip { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
  .meta-chip svg { width: 11px; height: 11px; }
  .chip-remote { color: var(--green); font-weight: 500; }
  .chip-salary { color: var(--text); font-weight: 500; }
  .chip-date { color: var(--faint); }
  .chip-nosal { color: var(--faint); font-style: italic; }
  .chip-pt { color: #7c3aed; font-weight: 500; } html.dark .chip-pt { color: #c4b5fd; }
  .chip-close { color: var(--muted); }
  .chip-close-soon { color: #b45309; font-weight: 600; }
  .chip-close-urgent { color: #dc2626; font-weight: 600; }
  html.dark .chip-close-soon { color: #fbbf24; } html.dark .chip-close-urgent { color: #f87171; }
  .nosal-toggle { display: flex; gap: 7px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; cursor: pointer; }
  .match-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .match-badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; }
  .badge-strong { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .badge-good { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
  .badge-new { background: var(--amber-bg); color: var(--amber); border: 1px solid #fde68a; }
  .card-expand-btn { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent); margin-top: 8px; cursor: pointer; background: none; border: none; padding: 0; }
  .card-expand-btn svg { width: 12px; height: 12px; transition: transform 0.2s; }
  .job-card.expanded .card-expand-btn svg { transform: rotate(180deg); }
  .card-detail { padding: 0 1rem 1rem; border-top: 1px solid var(--border); display: none; }
  .job-card.expanded .card-detail { display: block; }
  .detail-snippet { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 10px; }
  .apply-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 6px 14px; border-radius: var(--rs); border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 500; color: var(--accent); text-decoration: none; }
  .apply-link:hover { background: var(--accent-bg); border-color: var(--accent-border); }
  .apply-link svg { width: 11px; height: 11px; }
  .letter-link { margin-left: 6px; cursor: pointer; font-family: inherit; }
  .new-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: var(--accent); color: #fff; letter-spacing: .03em; }
  .new-count { color: var(--accent); font-weight: 600; }
  .search-status { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .search-status a { color: var(--accent); font-weight: 500; }
  .spinner-sm { width: 11px; height: 11px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .75s linear infinite; display: inline-block; }

  /* SITE NAV (jobs ↔ cover letters) */
  .site-nav { display: flex; gap: 2px; }
  .site-nav a { font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; padding: 5px 10px; border-radius: var(--rs); }
  .site-nav a:hover { color: var(--text); background: var(--bg); }
  .site-nav a.on { color: var(--accent); background: var(--accent-bg); }

  /* STATES */
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty-state .big { font-size: 28px; margin-bottom: 8px; }
  .empty-state p { font-size: 13px; line-height: 1.7; }
  .loading-state { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 3rem; color: var(--muted); font-size: 13px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* DEBUG */
  .debug-panel { background: #0f1117; border-radius: var(--r); padding: .875rem 1rem; display: none; font-family: 'SF Mono', monospace; font-size: 11px; line-height: 1.8; max-height: 220px; overflow-y: auto; }
  .debug-panel.visible { display: block; }
  .dl.info { color: #60a5fa; } .dl.ok { color: #4ade80; } .dl.warn { color: #fbbf24; } .dl.error { color: #f87171; }

  @media (max-width: 700px) { main { grid-template-columns: 1fr; } .sidebar { position: static; } .ptags { display: none; } }

  /* DARK MODE */
  html.dark {
    --bg: #111110; --surface: #1c1c1a; --border: #2e2e2b; --border-strong: #3d3d39;
    --text: #e8e6e1; --muted: #8a8880; --faint: #5a5856;
    --accent: #4f8ef7; --accent-bg: #1a2540; --accent-border: #2a3d6e;
    --green: #4ade80; --green-bg: #0f2318; --green-border: #1a4030;
    --amber: #fbbf24; --amber-bg: #1f1a0e;
    --red: #f87171; --red-bg: #2a1010; --red-border: #4a2020;
  }
  html.dark select, html.dark .sort-select { background: var(--surface); color: var(--text); border-color: var(--border); }
  html.dark .btn-dismiss { background: var(--surface); }
  html.dark .apply-link { background: var(--surface); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="8.5" r="6.5" stroke="white" stroke-width="1.5"/><path d="M5.5 8.8L7.5 10.8L11.5 6.2" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><div class="brand-name">Bubs jobs</div><div class="brand-sub">Jobs matched for a bubs</div></div>

      <div class="ptags">
        <span class="ptag">SENCO</span><span class="ptag">Asst. Headteacher</span><span class="ptag">Edinburgh + Remote</span>
      </div>
      <nav class="site-nav"><a href="index.html" class="on">Jobs</a><a href="letters.html">Cover letters</a></nav>
      <button id="dark-toggle" onclick="toggleDark()" style="background:none;border:1px solid var(--border);border-radius:var(--rs);padding:4px 8px;cursor:pointer;font-size:14px;color:var(--muted);">🌙</button>
    </div>
  </div>
</header>

<main>
  <aside class="sidebar">

    <div class="panel">
      <div class="panel-title">Role types</div>
      <div class="toggle-list" id="role-toggles">
        <label class="toggle-item">
          <span class="toggle-label">SENCO / Inclusion / SEN</span>
          <div class="toggle-switch"><input type="checkbox" value="senco"><div class="toggle-track"></div><div class="toggle-thumb"></div></div>
        </label>
        <label class="toggle-item">
          <span class="toggle-label">Safeguarding</span>
          <div class="toggle-switch"><input type="checkbox" value="safeguarding"><div class="toggle-track"></div><div class="toggle-thumb"></div></div>
        </label>
        <label class="toggle-item">
          <span class="toggle-label">Junior project manager</span>
          <div class="toggle-switch"><input type="checkbox" value="project"><div class="toggle-track"></div><div class="toggle-thumb"></div></div>
        </label>
        <label class="toggle-item">
          <span class="toggle-label">Leadership / Management</span>
          <div class="toggle-switch"><input type="checkbox" value="leadership"><div class="toggle-track"></div><div class="toggle-thumb"></div></div>
        </label>
        <label class="toggle-item">
          <span class="toggle-label">Education / EdTech</span>
          <div class="toggle-switch"><input type="checkbox" value="education"><div class="toggle-track"></div><div class="toggle-thumb"></div></div>
        </label>
        <label class="toggle-item">
          <span class="toggle-label">Learning roles (manager, officer)</span>
          <div class="toggle-switch"><input type="checkbox" value="ld"><div class="toggle-track"></div><div class="toggle-thumb"></div></div>
        </label>
        <label class="toggle-item">
          <span class="toggle-label">Charity / Third sector</span>
          <div class="toggle-switch"><input type="checkbox" value="charity"><div class="toggle-track"></div><div class="toggle-thumb"></div></div>
        </label>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Filters</div>
      <div class="select-group">
        <div class="select-label">Location</div>
        <select id="location-type">
          <option value="both">Edinburgh + Remote</option>
          <option value="edinburgh">Edinburgh only</option>
          <option value="remote">Remote / WFH only</option>
        </select>
      </div>
      <div class="select-group">
        <div class="select-label">Minimum salary</div>
        <select id="salary-min">
          <option value="25000">£25,000+</option>
          <option value="30000">£30,000+</option>
          <option value="35000" selected>£35,000+</option>
          <option value="40000">£40,000+</option>
          <option value="45000">£45,000+</option>
          <option value="50000">£50,000+</option>
          <option value="55000">£55,000+</option>
        </select>
        <label class="nosal-toggle"><input type="checkbox" id="include-nosal" onchange="try{localStorage.setItem('bubs_include_nosal',this.checked?'1':'0')}catch(e){}"> Include jobs with no salary listed</label>
      </div>
    </div>

    <div class="panel" style="display:flex;flex-direction:column;gap:7px;">
      <button class="btn-search" id="search-btn" onclick="runSearch()">Search jobs</button>
      <button class="btn-debug" onclick="toggleDebug()">🛠 Debug</button>
    </div>

    <div class="debug-panel" id="debug-panel"></div>
  </aside>

  <div class="results-col">
    <div id="results-area">
      <div class="loading-state"><div class="spinner"></div><span>Finding jobs for a bubs…</span></div>
    </div>
  </div>
</main>

const REMOTE_T = ['remote','work from home','wfh','home based','home-based','anywhere in the uk','uk wide','nationwide'];

// These patterns in the title = instant drop, no exceptions
const HARD_EXCLUDE_PATTERNS = [
  /\bteacher\b/,
  /\bteaching\b(?!.*assistant)/,  // allow "teaching assistant" but not plain "teaching"
  /\blecturer\b/,
  /\bprofessor\b/,
  /\bsocial worker\b/,
  /\bnqt\b/,
  /\bhead of \w+ school\b/,
  /\breligious education\b/,
  /\bhome economics\b/,
  /\bmodern studies\b/,
  /\bcover supervisor\b/,
  /\bsupply\b.*\bschool\b/,
];

function isRelevantJob(job){
  const title=(job.title||'').toLowerCase();
  const full=title+' '+(job.description||'').toLowerCase();

  // Hard pattern exclusions — catches "Teacher of X", "X Teacher", etc.
  if(HARD_EXCLUDE_PATTERNS.some(p=>p.test(title)))return false;

  const isJuniorPM=['junior project','trainee project','assistant project','project support'].some(t=>title.includes(t));
  if(!isJuniorPM&&EXCLUDE_TITLE.some(ex=>title.includes(ex)))return false;
  const titlePass=INCLUDE_TITLE.some(i=>title.includes(i));
  if(!titlePass&&EXCLUDE_DESC.some(ex=>full.includes(ex)))return false;
  if(INCLUDE_TITLE.some(i=>title.includes(i)))return true;
  if(INCLUDE_ANY.some(i=>full.includes(i)))return true;
  if(isJuniorPM)return true;
  return false;
}
function jobIsEdinburgh(j){return SCOTLAND.some(t=>(j.location||'').toLowerCase().includes(t));}
function jobIsRemote(j){const t=((j.title||'')+' '+(j.description||'')+' '+(j.location||'')).toLowerCase();return REMOTE_T.some(r=>t.includes(r));}
function detectTags(job){const t=((job.title||'')+' '+(job.description||'')+' '+(job.location||'')).toLowerCase();const found=new Map();for(const[kw,tag]of Object.entries(MATCH_TAGS))if(t.includes(kw)&&!found.has(tag.label))found.set(tag.label,tag);return Array.from(found.values()).slice(0,5);}
function scoreJob(job){const t=((job.title||'')+' '+(job.description||'')).toLowerCase();let s=0;['project','safeguarding','senco','sen','inclusion','education','leadership','manager','coordinator','consultant','charity','third sector','wellbeing','pastoral'].forEach(k=>{if(t.includes(k))s++;});if(t.includes('safeguarding')||t.includes('senco')||t.includes('inclusion'))s+=3;if(t.includes('junior')||t.includes('entry level'))s+=1;return s;}
function salaryNum(job){return actualPay(job)||0;} // actual yearly pay, allowing for part-time hours
function salaryStr(job){if(job.salaryMin&&job.salaryMax)return`£${Math.round(job.salaryMin/1000)}k–£${Math.round(job.salaryMax/1000)}k`;if(job.salaryMin)return`From £${Math.round(job.salaryMin/1000)}k`;if(job.salary)return job.salary;return null;}
function guessRole(job){const t=(job.title||'').toLowerCase();if(t.includes('safeguard')||t.includes('dsl'))return'safeguarding';if(t.includes('senco')||t.includes('sen ')||t.includes('inclusion')||t.includes('send'))return'senco';if(t.includes('project')||t.includes('programme'))return'project';if(t.includes('charity')||t.includes('voluntary')||t.includes('third sector'))return'charity';if(t.includes('learning manager')||t.includes('learning officer')||t.includes('l&d')||t.includes('learning and development')||t.includes('training manager')||t.includes('skills coach'))return'ld';if(t.includes('education')||t.includes('edtech')||t.includes('curriculum'))return'education';return'leadership';}
function formatDate(str){if(!str)return null;const d=parseUKDate(str);if(isNaN(d))return null;const now=new Date();const days=Math.floor((now-d)/86400000);if(days===0)return'Today';if(days===1)return'Yesterday';if(days<7)return`${days}d ago`;if(days<30)return`${Math.floor(days/7)}w ago`;return`${Math.floor(days/30)}mo ago`;}

// --- API CALLS ---
// Each one returns jobs tagged with _q (which search found them), so we can track which searches are worth running.
const withRemote=q=>/remote/i.test(q)?q:q+' remote';
async function adzunaOne(it,sal){const what=it.loc==='remote'?withRemote(it.q):it.q,where=it.loc==='remote'?'uk':'edinburgh';try{const p=new URLSearchParams({what,where,salary:sal});const r=await fetch(`${ADZUNA_PROXY}?${p}`);if(!r.ok){log(`Adzuna "${what}" → ${r.status}`,'error');return[];}const d=await r.json();if(d.error){log(`Adzuna "${what}" err: ${d.error}`,'error');return[];}log(`Adzuna "${what}" @ ${where} → ${d.results?.length??0}`,d.results?.length?'ok':'warn');return(d.results||[]).map(j=>({id:'az-'+j.id,source:'adzuna',_q:it.key,title:j.title,org:j.company?.display_name||'',location:j.location?.display_name||'',description:j.description,salaryMin:j.salary_min,salaryMax:j.salary_max,url:j.redirect_url,created:j.created,_ptFlag:j.contract_time==='part_time'}));}catch(e){log(`Adzuna "${what}" err: ${e.message}`,'error');return[];}}
// Remote: Reed has no remote filter, so put "remote" in the search words (previously it searched the whole UK and ~90% got thrown away)
async function reedOne(it,sal){const remote=it.loc==='remote',what=remote?withRemote(it.q):it.q;try{const p=new URLSearchParams({keywords:what,minimumSalary:sal,...(remote?{remote:'true'}:{location:'Edinburgh',distance:'20'})});const r=await fetch(`${REED_PROXY}?${p}`);if(!r.ok){log(`Reed "${what}" → ${r.status}`,'error');return[];}const d=await r.json();if(d.error){log(`Reed "${what}" err: ${d.error}`,'error');return[];}log(`Reed "${what}"${remote?'':' @ Edinburgh'} → ${d.results?.length??0}`,d.results?.length?'ok':'warn');return(d.results||[]).map(j=>({id:'reed-'+j.jobId,source:'reed',_q:it.key,title:j.jobTitle,org:j.employerName||'',location:j.locationName||'',description:j.jobDescription,salary:j.minimumSalary?`£${Math.round(j.minimumSalary/1000)}k${j.maximumSalary?'–£'+Math.round(j.maximumSalary/1000)+'k':'+'}`:null,salaryMin:j.minimumSalary,url:j.jobUrl,created:parseUKDate(j.date)?.toISOString()||null,closes:parseUKDate(j.expirationDate)?.toISOString()||null}));}catch(e){log(`Reed "${what}" err: ${e.message}`,'error');return[];}}
async function joobleOne(it,sal){const remote=it.loc==='remote',what=remote?withRemote(it.q):it.q;try{const p=new URLSearchParams({keywords:what,location:remote?'':'Edinburgh',minimumSalary:sal||35000,remote:remote?'true':'false'});const r=await fetch(`${JOOBLE_PROXY}?${p}`);if(r.status===429){let detail='';try{detail=(await r.json()).detail||'';}catch(_){}const e=new Error('429');e.code=429;e.detail=String(detail).slice(0,150);throw e;}if(!r.ok){log(`Jooble "${what}" → ${r.status}`,'error');return[];}const d=await r.json();if(d.error){log(`Jooble "${what}" err: ${d.error}`,'error');return[];}const jobs=d.jobs||[];
  // Jooble returns 30 regardless of quality — pre-filter: at least one meaningful keyword must appear in title or snippet
  const kwWords=it.q.toLowerCase().replace(' remote','').split(' ').filter(w=>w.length>3);
  const relevant=jobs.filter(j=>{const txt=((j.title||'')+' '+(j.snippet||'')).toLowerCase();return kwWords.some(w=>txt.includes(w));});
  log(`Jooble "${what}"${remote?'':' @ Edinburgh'} → ${jobs.length} (${relevant.length} relevant)`,relevant.length?'ok':'warn');
  return relevant.map(j=>{
    const cleanTitle=(j.title||'').replace(/\s*-\s*\d+_\d+\s*$/, '').replace(/\s*-\s*\d{5,}\s*$/, '').trim();
    return {id:'jooble-'+(j.id||Math.random()),source:'jooble',_q:it.key,title:cleanTitle,org:j.company||'',location:j.location||'',description:j.snippet||'',salary:j.salary||null,_ptFlag:/part/i.test(j.type||''),url:j.link||'#',created:j.updated||null};
  });}catch(e){if(e.code===429)throw e;log(`Jooble "${what}" err: ${e.message}`,'error');return[];}}

// --- SEARCH BUDGETS & MEMORY ---
// Limits: Jooble 100 requests/day. Adzuna 25/minute, 250/day, 1,000/week, 2,500/month. Reed doesn't publish one.
const CACHE_KEY='bubs_search_cache_v1', SEEN_KEY='bubs_seen_v1', YIELD_KEY='bubs_query_yield_v1', JOOBLE_USE_KEY='bubs_jooble_used_v1';
const CACHE_HOURS=6;            // reopening the page within this time *on the same day* shows saved results (0 requests)
const JOOBLE_DAILY=100, JOOBLE_FIRST_OF_DAY=40, JOOBLE_PER_SEARCH=15; // first search of the day covers almost all of Jooble's searches, refreshes get 15
const localDay=t=>new Date(t).toDateString();
const ADZUNA_PER_SEARCH=24;     // under Adzuna's 25/minute, so a search never trips it
const kv={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const todayUTC=()=>new Date().toISOString().slice(0,10);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// Which searches to spend a limited budget on: never-tried ones first, then the ones that have
// actually produced jobs (after filtering), with a small boost for ones not tried recently.
function queryPriority(key,y){const r=y[key];if(!r||!r.hist.length)return 1000;const avg=r.hist.reduce((a,b)=>a+b,0)/r.hist.length;return avg*10+Math.min((Date.now()-r.last)/86400000,7);}
function pickBudget(items,budget,y){return [...items].sort((a,b)=>queryPriority(b.key,y)-queryPriority(a.key,y)).slice(0,Math.max(0,budget));}
function joobleUsedToday(){const u=kv.get(JOOBLE_USE_KEY,{});return u.date===todayUTC()?u.n:0;}
function addJoobleUse(n){kv.set(JOOBLE_USE_KEY,{date:todayUTC(),n:joobleUsedToday()+n});}

// --- SOURCE RUNNERS (each hands results over as they arrive, so the page fills in progressively) ---
async function runReed(items,sal,onJobs,progress){
  await Promise.all(items.map(async it=>{onJobs(await reedOne(it,sal));progress.reed++;}));
}
async function runAdzuna(items,sal,onJobs,progress,batchSize=4,gapMs=300){
  for(let i=0;i<items.length;i+=batchSize){
    const batch=items.slice(i,i+batchSize);
    await Promise.all(batch.map(async it=>{onJobs(await adzunaOne(it,sal));progress.adzuna++;}));
    if(i+batchSize<items.length)await wait(gapMs);
  }
}
// Jooble rate-limits bursts and has a 100/day cap: 2 at a time with a pause, retry a 429 once,
// stop for the day on "daily request limit", stop the run after 3 refusals.
async function runJooble(items,sal,onJobs,progress,concurrency=2,gapMs=500){
  const today=todayUTC();
  let quotaDay=null;try{quotaDay=localStorage.getItem('bubs_jooble_quota');}catch(_){}
  if(quotaDay===today){log(`Jooble skipped: its daily request limit was used up earlier today. It should work again tomorrow.`,'warn');progress.joobleTotal=0;return;}
  let strikes=0,stopped=false;
  async function one(it){
    for(let attempt=0;attempt<2;attempt++){
      if(stopped)return[];
      addJoobleUse(1);
      try{const jobs=await joobleOne(it,sal);strikes=0;return jobs;}
      catch(e){
        if(e.code!==429)return[];
        if(/daily request limit/i.test(e.detail||'')){
          if(!stopped){stopped=true;try{localStorage.setItem('bubs_jooble_quota',today);}catch(_){}
            log(`Jooble's daily request limit is used up, so Jooble is skipped until tomorrow`,'error');}
          return[];
        }
        if(attempt===0){log(`Jooble "${it.q}" → 429, retrying in 2s${e.detail?' ('+e.detail+')':''}`,'warn');await wait(2000);}
      }
    }
    strikes++;log(`Jooble "${it.q}" → 429 again`,'error');return[];
  }
  for(let i=0;i<items.length&&!stopped;i+=concurrency){
    const batch=items.slice(i,i+concurrency);
    (await Promise.all(batch.map(one))).forEach(r=>onJobs(r));
    progress.jooble+=batch.length;
    if(stopped)break;
    if(strikes>=3){stopped=true;log(`Jooble keeps refusing (rate limit or daily quota), so the other ${items.length-i-batch.length} Jooble searches were skipped`,'error');break;}
    if(i+concurrency<items.length)await wait(gapMs);
  }
  if(stopped)progress.joobleTotal=progress.jooble;
}

// --- SALARY, CLOSING DATES & FIT (all free, no AI) ---
// Reed sends dates as dd/mm/yyyy, which JavaScript misreads as mm/dd, so parse them properly.
function parseUKDate(s){if(!s)return null;const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);if(m)return new Date(+m[3],+m[2]-1,+m[1],12,0);const d=new Date(s);return isNaN(d)?null:d;}
const dateVal=s=>{const d=parseUKDate(s);return d?d.getTime():0;};
// --- PAY: works out what a job would actually pay, allowing for part-time hours ---
const FT_HOURS=37.5;
// Read a pay figure from text: "£35k - £40k", "£16.50 per hour", "£180 a day". Returns the lower end and its basis.
function parsePay(s){
  if(!s)return null;const t=String(s).toLowerCase().replace(/,/g,'');
  const m=t.match(/(\d+(?:\.\d+)?)\s*(k\b)?/);if(!m)return null;
  const v=parseFloat(m[1])*(m[2]?1000:1);
  if(/hour|\bhr\b|p\/h|\bph\b/.test(t))return{rate:v,basis:'hour'};
  if(/day|daily/.test(t))return{rate:v,basis:'day'};
  if(/week/.test(t))return{rate:v,basis:'week'};
  if(/month/.test(t))return{rate:v,basis:'month'};
  return v>=1000?{rate:v,basis:'year'}:null;
}
// Hours per week from the advert: "16 hours per week", "21 hrs pw", "3 days a week", "0.6 FTE"
function findHours(t){
  let m=t.match(/(\d{1,2}(?:\.\d+)?)\s*(?:hours|hrs|hr)\s*(?:per|a|each|\/|p\/?)\s*w(?:ee)?k/)||t.match(/(\d{1,2}(?:\.\d+)?)\s*(?:hours|hrs)\s*pw\b/);
  if(m)return parseFloat(m[1]);
  m=t.match(/(\d(?:\.\d)?)\s*days?\s*(?:per|a|each)\s*week/);if(m)return parseFloat(m[1])*7.5;
  m=t.match(/(0?\.\d+)\s*fte\b/);if(m)return parseFloat(m[1])*FT_HOURS;
  return null;
}
function payInfo(job){
  if(job._pay!==undefined)return job._pay;
  const text=((job.title||'')+' '+(job.description||'')+' '+(job.salary||'')).replace(/<[^>]+>/g,' ').toLowerCase();
  // Pay as given
  let pay=null;
  if(job.salaryMin){pay=job.salaryMin<200?{rate:job.salaryMin,basis:'hour'}:job.salaryMin<1000?{rate:job.salaryMin,basis:'day'}:{rate:job.salaryMin,basis:'year'};}
  else pay=parsePay(job.salary);
  // Part-time?
  const hours=findHours(text);
  const saysPT=/part[- ]?time|\bp\/t\b|term[- ]time only|pro[- ]?rata/.test(text)&&!/full[- ]?time/.test(text);
  const partTime=!!((hours&&hours<35)||saysPT||job._ptFlag);
  const h=hours&&hours<35?hours:(partTime?null:FT_HOURS); // null = part-time but hours unknown
  let fte=null,actual=null;
  if(pay){
    const perYearFT={hour:pay.rate*FT_HOURS*52,day:pay.rate*5*46,week:pay.rate*52,month:pay.rate*12,year:pay.rate}[pay.basis];
    fte=Math.round(perYearFT);
    if(h!=null)actual=Math.round(pay.basis==='hour'?pay.rate*h*52:pay.basis==='day'?pay.rate*(h/7.5)*46:perYearFT*h/FT_HOURS);
  }
  return (job._pay={pay,fte,actual,partTime,hours:h&&h<FT_HOURS?h:null});
}
// What she'd actually earn in a year (null if part-time with unknown hours, or no pay listed)
function actualPay(job){return payInfo(job).actual;}
function hasSalary(job){return actualPay(job)!=null;}
// Extra pay text for the card when the headline salary isn't what she'd take home
function payNote(job){
  const p=payInfo(job);if(!p.pay)return null;
  const k=v=>v>=10000?`£${(v/1000).toFixed(1).replace(/\.0$/,'')}k`:`£${v.toLocaleString()}`;
  const rate=p.pay.basis==='hour'?`£${p.pay.rate.toFixed(2).replace(/\.00$/,'')}/hr`:p.pay.basis==='day'?`£${p.pay.rate}/day`:null;
  if(p.partTime&&p.actual!=null)return `${rate||k(p.fte)+' FTE'} ≈ ${k(p.actual)} a year at ${p.hours} hrs/wk`;
  if(p.partTime)return `${rate||k(p.fte)+' FTE'} · hours not stated`;
  if(rate)return `${rate} ≈ ${k(p.actual)} a year full-time`;
  return null;
}
function includeNoSalary(){const el=document.getElementById('include-nosal');return !!(el&&el.checked);}

function closesInfo(j){
  const d=parseUKDate(j.closes);if(!d)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-today)/86400000);
  if(days<0)return {expired:true};
  const text=days===0?'Closes today':days===1?'Closes tomorrow':days<=13?`Closes in ${days} days`:`Closes ${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
  return {days,text,cls:days<=3?'chip-close-urgent':days<=7?'chip-close-soon':'chip-close'};
}

// Stamp score and role, and drop expired / below-salary jobs. Used for fresh and saved results.
function annotateAndFilter(jobs){
  const min=+document.getElementById('salary-min').value||0,noSal=includeNoSalary();
  const det=kv.get(DETAIL_KEY,{});
  return jobs.filter(j=>{
    const d=det[j.id];if(d){j.description=d.text;j._full=true;if(d.pt)j._ptFlag=true;} // full Reed advert
    const c=closesInfo(j);if(c&&c.expired)return false;
    j._pay=undefined; // recalculate
    if(hasSalary(j)){if(salaryNum(j)<min*0.98)return false;} else if(!noSal)return false; // no salary, or part-time with hours not stated: only kept when the tick box is on
    j._score=scoreJob(j);j._role=guessRole(j);return true;
  });
}

// --- SEARCH ---
let searchMeta={salLabel:'',at:null,fromCache:false,running:false,progress:null,newCount:0};
let rawJobs=[], seenBefore=new Set(), firstEverSearch=false, _renderTimer=null;

function settingsKey(roles,locMode,salMin){return JSON.stringify([...roles].sort())+'|'+locMode+'|'+salMin+'|'+(includeNoSalary()?'nosal':'');}

// Turn the raw results into the job lists: dedupe, sector + location filters, archive, scores, "new" flags
function processRaw(locMode){
  const seenId=new Set(),seenKey=new Set();
  const deduped=rawJobs.filter(j=>{
    if(seenId.has(j.id))return false;seenId.add(j.id);
    const k=(j.title+j.org).toLowerCase().replace(/\s/g,'');
    if(seenKey.has(k))return false;seenKey.add(k);
    return true;
  });
  let jobs=deduped.filter(j=>isRelevantJob(j));
  const sectorCount=jobs.length;
  if(locMode==='edinburgh') jobs=jobs.filter(j=>jobIsEdinburgh(j));
  else if(locMode==='remote') jobs=jobs.filter(j=>jobIsRemote(j));
  else jobs=jobs.filter(j=>jobIsEdinburgh(j)||jobIsRemote(j));
  jobs.forEach(j=>{if(j._new===undefined)j._new=!firstEverSearch&&!seenBefore.has(j.id);});
  universe=jobs;
  return {raw:rawJobs.length,deduped:deduped.length,sector:sectorCount,kept:finalizeJobs()};
}
// Last step, re-run whenever full adverts arrive: salary and closing dates, then split off archived jobs
let universe=[];
function finalizeJobs(){
  const jobs=annotateAndFilter(universe);
  const archivedIds=new Set(loadArchive());
  archived=jobs.filter(j=>archivedIds.has(j.id));
  allJobs=jobs.filter(j=>!archivedIds.has(j.id));
  searchMeta.newCount=allJobs.filter(j=>j._new).length;
  return jobs;
}

// --- FULL ADVERTS (Reed only) ---
// Search results only carry a 2-3 line preview. Reed's official "job details" request returns the whole
// advert, so part-time hours are caught and the cover letter page gets the full text.
// Each job is fetched once and kept for 30 days, so after the first day only new jobs cost a request.
const DETAIL_KEY='bubs_reed_details_v1';
let detailsToken=0;
function htmlToText(html){return new DOMParser().parseFromString(String(html||'').replace(/<(br|\/p|\/li|\/h\d|\/div)[^>]*>/gi,'$&\n'),'text/html').body.textContent.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();}
async function loadReedDetails(jobs){
  const token=++detailsToken;
  const det=kv.get(DETAIL_KEY,{}),now=Date.now();
  for(const k in det)if(now-det[k].t>30*86400000)delete det[k];
  const todo=jobs.filter(j=>j.source==='reed'&&!det[j.id]);
  kv.set(DETAIL_KEY,det);
  if(!todo.length)return;
  searchMeta.details={done:0,total:todo.length};render();
  log(`Reading ${todo.length} full Reed advert${todo.length===1?'':'s'} so hours and cover letters use the whole advert…`,'info');
  for(let i=0;i<todo.length;i+=3){
    if(token!==detailsToken)return; // a newer search has started
    await Promise.all(todo.slice(i,i+3).map(async j=>{
      try{
        const r=await fetch(`${REED_PROXY}?jobId=${encodeURIComponent(j.id.replace('reed-',''))}`);
        if(r.ok){const d=await r.json();if(d.jobDescription)det[j.id]={t:Date.now(),text:htmlToText(d.jobDescription).slice(0,8000),pt:!!d.partTime&&!d.fullTime};}
        else log(`Reed advert ${j.id} → ${r.status}`,'warn');
      }catch(e){}
      searchMeta.details.done++;
    }));
    kv.set(DETAIL_KEY,det);
    finalizeJobs();render();
    if(i+3<todo.length)await wait(250);
  }
  searchMeta.details=null;finalizeJobs();render();
  log(`Full adverts read for ${todo.length} Reed job${todo.length===1?'':'s'}`,'ok');
}
function scheduleRender(locMode){
  if(_renderTimer)return;
  _renderTimer=setTimeout(()=>{_renderTimer=null;processRaw(locMode);if(allJobs.length||archived.length)render();},400);
}

async function runSearch(force=false){
  const btn=document.getElementById('search-btn');
  const locMode=document.getElementById('location-type').value;
  const salMin=document.getElementById('salary-min').value;
  const salLabel=document.getElementById('salary-min').selectedOptions[0].text;
  const roles=getSelectedRoles();
  const key=settingsKey(roles,locMode,salMin);
  if(searchMeta.running)return;

  // 1. Saved results: same settings, searched recently → show them, no requests
  const cache=kv.get(CACHE_KEY,null);
  // Only reuse results from today and under 6 hours old, so the first visit each morning always searches fresh
  if(!force&&cache&&cache.key===key&&localDay(cache.at)===localDay(Date.now())&&Date.now()-cache.at<CACHE_HOURS*3600000){
    document.getElementById('debug-panel').innerHTML='';
    const archivedIds=new Set(loadArchive());
    searchMeta={salLabel,at:cache.at,fromCache:true,running:false,progress:null,newCount:0};
    universe=cache.jobs;finalizeJobs(); // drops anything that has closed since
    log(`Showing saved results from ${new Date(cache.at).toLocaleTimeString()} (no search requests used). Press Refresh for a new search.`,'ok');
    currentTab='active';render();loadReedDetails(universe);return;
  }

  document.getElementById('debug-panel').innerHTML='';
  btn.disabled=true;btn.textContent='Searching…';
  document.getElementById('results-area').innerHTML='<div class="loading-state"><div class="spinner"></div><span>Searching Reed, Adzuna and Jooble…</span></div>';
  log(`Roles: ${roles.join(', ')} | ${locMode} | ${salLabel}`,'info');

  const querySet=new Set();
  roles.forEach(r=>(SEARCH_QUERIES[r]||[]).forEach(q=>querySet.add(q)));
  const queries=[...querySet];
  if(roles.includes('senco')&&locMode!=='edinburgh')['SEND coordinator'].forEach(q=>querySet.add(q));

  // One list of searches per source: each search term × (Edinburgh and/or remote)
  const locs=locMode==='both'?['edinburgh','remote']:[locMode];
  const plan=src=>[...querySet].flatMap(q=>locs.map(loc=>({source:src,q,loc,key:`${src}|${q}|${loc}`})));
  const y=kv.get(YIELD_KEY,{});
  const reedItems=plan('reed');
  const adzunaItems=pickBudget(plan('adzuna'),ADZUNA_PER_SEARCH,y);
  const joobleUsed=joobleUsedToday(),joobleLeft=JOOBLE_DAILY-joobleUsed;
  const joobleBudget=joobleUsed===0?JOOBLE_FIRST_OF_DAY:JOOBLE_PER_SEARCH; // Jooble's allowance resets at midnight UTC
  const joobleItems=pickBudget(plan('jooble'),Math.min(joobleBudget,joobleLeft),y);
  log(`${queries.length} search terms → Reed ${reedItems.length} · Adzuna ${adzunaItems.length} of ${plan('adzuna').length} · Jooble ${joobleItems.length} of ${plan('jooble').length} (about ${Math.max(0,joobleLeft)} Jooble requests left today)`,'info');

  // 2. Run all three sources at once, each at its own safe pace, showing results as they arrive
  seenBefore=new Set(kv.get(SEEN_KEY,[]).map(s=>s.id));
  firstEverSearch=seenBefore.size===0;
  rawJobs=[];
  const progress={reed:0,adzuna:0,jooble:0,reedTotal:reedItems.length,adzunaTotal:adzunaItems.length,joobleTotal:joobleItems.length};
  searchMeta={salLabel,at:Date.now(),fromCache:false,running:true,progress,newCount:0};
  currentTab='active';
  const onJobs=jobs=>{rawJobs.push(...jobs);scheduleRender(locMode);};
  // With "no salary listed" on, ask the boards for everything and filter by salary here (otherwise they drop unsalaried jobs)
  const apiSal=includeNoSalary()?'0':salMin;
  await Promise.all([
    runReed(reedItems,apiSal,onJobs,progress),
    runAdzuna(adzunaItems,apiSal,onJobs,progress),
    runJooble(joobleItems,apiSal,onJobs,progress),
  ]);
  clearTimeout(_renderTimer);_renderTimer=null;

  // 3. Final pass
  const r=processRaw(locMode);
  log(`Sector filter: ${r.deduped} → ${r.sector}`,'info');
  log(`Location filter: ${r.sector} → ${r.kept.length}`,'info');
  searchMeta.running=false;searchMeta.at=Date.now();

  // 4. Remember: which jobs she's seen (for "New" badges), the results (cache), and which searches produced jobs
  const seenList=kv.get(SEEN_KEY,[]).filter(s=>Date.now()-s.t<30*86400000);
  const seenIds=new Set(seenList.map(s=>s.id));
  r.kept.forEach(j=>{if(!seenIds.has(j.id))seenList.push({id:j.id,t:Date.now()});});
  kv.set(SEEN_KEY,seenList.slice(-3000));
  kv.set(CACHE_KEY,{key,at:searchMeta.at,jobs:universe});
  recordYield([...reedItems,...adzunaItems,...joobleItems.slice(0,progress.jooble)],r.kept,y);

  const az=allJobs.filter(j=>j.source==='adzuna').length,rd=allJobs.filter(j=>j.source==='reed').length,jb=allJobs.filter(j=>j.source==='jooble').length;
  log(`Done: ${allJobs.length} active + ${archived.length} archived — Adzuna ${az} · Reed ${rd} · Jooble ${jb}${firstEverSearch?'':` · ${searchMeta.newCount} new`}`,allJobs.length?'ok':'warn');
  render();
  btn.disabled=false;btn.textContent='Search jobs';
  loadReedDetails(universe); // in the background: full adverts for hours and cover letters
}

// Track how many jobs each search actually contributed after filtering (last 5 runs),
// then log which searches earn their place and which never do.
function recordYield(tried,kept,y){
  const counts={};kept.forEach(j=>{if(j._q)counts[j._q]=(counts[j._q]||0)+1;});
  tried.forEach(it=>{const r=y[it.key]||{hist:[],last:0};r.hist=[...r.hist,counts[it.key]||0].slice(-5);r.last=Date.now();y[it.key]=r;});
  kv.set(YIELD_KEY,y);
  const rows=Object.entries(y).map(([k,r])=>({k,avg:r.hist.reduce((a,b)=>a+b,0)/r.hist.length,runs:r.hist.length}));
  const label=k=>{const[s,q,l]=k.split('|');return `${s[0].toUpperCase()+s.slice(1)} "${q}" (${l})`;};
  const best=rows.filter(r=>r.avg>0).sort((a,b)=>b.avg-a.avg).slice(0,8);
  const dead=rows.filter(r=>r.avg===0&&r.runs>=3);
  if(best.length)log(`Most useful searches (avg jobs kept): ${best.map(r=>`${label(r.k)} ${r.avg.toFixed(1)}`).join(' · ')}`,'ok');
  if(dead.length)log(`Never useful in their last ${3}+ runs (candidates to drop): ${dead.map(r=>label(r.k)).join(' · ')}`,'warn');
}

// --- DISMISS / RESTORE ---
function dismiss(id){
  const idx=allJobs.findIndex(j=>j.id===id);
  if(idx===-1)return;
  const [job]=allJobs.splice(idx,1);
  archived.push(job);
  saveArchive();
  render();
}
function restore(id){
  const idx=archived.findIndex(j=>j.id===id);
  if(idx===-1)return;
  const [job]=archived.splice(idx,1);
  allJobs.push(job);
  // re-sort
  allJobs.sort((a,b)=>new Date(b.created||0)-new Date(a.created||0));
  saveArchive();
  render();
}
function clearArchive(){archived=[];saveArchive();render();}

// --- RENDER ---
function render(){
  currentTab==='active'?renderActive():renderArchived();
  updateTabCounts();
}

function updateTabCounts(){
  const area=document.getElementById('results-area');
  const tabEl=area.querySelector('.tabs');
  if(!tabEl)return;
  tabEl.querySelector('[data-tab="active"] .tab-count').textContent=allJobs.length;
  tabEl.querySelector('[data-tab="archived"] .tab-count').textContent=archived.length;
}

function tabsHTML(){
  return `<div class="tabs">
    <div class="tab${currentTab==='active'?' active':''}" data-tab="active" onclick="switchTab('active')">Jobs <span class="tab-count">${allJobs.length}</span></div>
    <div class="tab${currentTab==='archived'?' active':''}" data-tab="archived" onclick="switchTab('archived')">Archived <span class="tab-count">${archived.length}</span></div>
  </div>`;}
function switchTab(t){currentTab=t;render();}

function getSorted(jobs){
  const sort=document.getElementById('sort-select')?.value||'recent';
  const j=[...jobs];
  if(sort==='salary-high')j.sort((a,b)=>(salaryNum(b)||0)-(salaryNum(a)||0));
  else if(sort==='salary-low')j.sort((a,b)=>(salaryNum(a)||999999)-(salaryNum(b)||999999));
  else if(sort==='relevance')j.sort((a,b)=>b._score-a._score);
  else if(sort==='new')j.sort((a,b)=>(b._new?1:0)-(a._new?1:0)||dateVal(b.created)-dateVal(a.created));
  else if(sort==='closing')j.sort((a,b)=>(dateVal(a.closes)||9e15)-(dateVal(b.closes)||9e15));
  else j.sort((a,b)=>dateVal(b.created)-dateVal(a.created)); // default: recent
  return j;
}

function renderActive(){
  const area=document.getElementById('results-area');
  if(!allJobs.length){
    if(searchMeta.running){area.innerHTML='<div class="loading-state"><div class="spinner"></div><span>Searching Reed, Adzuna and Jooble…</span></div>';return;}
    area.innerHTML=tabsHTML()+`<div class="empty-state"><div class="big">😕</div><p>No results — try different filters or lower the salary.<br>Open <strong>🛠 Debug</strong> to diagnose.</p>${statusHTML()}</div>`;
    return;
  }
  const sortVal=document.getElementById('sort-select')?.value||'recent';
  const jobs=getSorted(allJobs);

  // Always build group nav from active jobs
  const byRoleAll=new Map();
  allJobs.forEach(j=>{if(!byRoleAll.has(j._role))byRoleAll.set(j._role,[]);byRoleAll.get(j._role).push(j);});
  const roleOrder=['senco','safeguarding','project','leadership','education','ld','charity'];
  const sortedGroups=[...byRoleAll.entries()].sort((a,b)=>roleOrder.indexOf(a[0])-roleOrder.indexOf(b[0]));
  const groupNav='<div class="group-nav">'+sortedGroups.map(([role,rjobs])=>
    `<span class="group-pill" data-role="${role}" onclick="jumpToGroup('${role}')">${ROLE_LABELS[role]||role} <strong>(${rjobs.length})</strong></span>`
  ).join('')+'</div>';

  let sections='';
  if(sortVal==='group'){
    sections=sortedGroups.map(([role,rjobs])=>{
      const sorted=getSorted(rjobs);
      return `<div class="group-section" id="group-${role}">
        <div class="group-heading">${ROLE_LABELS[role]||role} <span class="group-count">${rjobs.length} roles</span></div>
        <div class="job-list">${sorted.map((j,i)=>cardHTML(j,'a-'+role+'-'+i,false)).join('')}</div>
      </div>`;
    }).join('');
  } else {
    sections=`<div class="job-list">${jobs.map((j,i)=>cardHTML(j,'a'+i,false)).join('')}</div>`;
  }

  const n=s=>allJobs.filter(j=>j.source===s).length;
  const countLine=`${allJobs.length} results · ${searchMeta.salLabel} · Adzuna ${n('adzuna')} · Reed ${n('reed')} · Jooble ${n('jooble')}`;
  const newLine=searchMeta.newCount?` · <span class="new-count">${searchMeta.newCount} new</span>`:'';
  area.innerHTML=`
    ${tabsHTML()}
    <div class="results-toolbar">
      <div><div class="results-count">${allJobs.length} roles found${newLine}</div><div class="status-bar">${countLine}</div>${statusHTML()}</div>
      <select class="sort-select" id="sort-select" onchange="render()">
        <option value="recent"${sortVal==='recent'?' selected':''}>Most recent</option>
        <option value="new"${sortVal==='new'?' selected':''}>New first</option>
        <option value="closing"${sortVal==='closing'?' selected':''}>Closing soonest</option>
        <option value="group"${sortVal==='group'?' selected':''}>Group by role type</option>
        <option value="relevance"${sortVal==='relevance'?' selected':''}>Best match</option>
        <option value="salary-high"${sortVal==='salary-high'?' selected':''}>Salary: high → low</option>
        <option value="salary-low"${sortVal==='salary-low'?' selected':''}>Salary: low → high</option>
      </select>
    </div>
    ${groupNav}
    ${sections}`;
}

function renderArchived(){
  const area=document.getElementById('results-area');
  if(!archived.length){
    area.innerHTML=tabsHTML()+'<div class="empty-state"><div class="big">🗂️</div><p>No archived jobs yet.<br>Hit <strong>✕</strong> on any listing to hide it here.</p></div>';
    return;
  }
  const jobs=[...archived].sort((a,b)=>new Date(b.created||0)-new Date(a.created||0));
  area.innerHTML=`
    ${tabsHTML()}
    <div class="results-toolbar">
      <div><div class="results-count">${archived.length} archived</div><div class="status-bar">Jobs you've dismissed</div></div>
      <button style="font-size:12px;padding:5px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;" onclick="clearArchive()">Clear all</button>
    </div>
    <div class="job-list">${jobs.map((j,i)=>cardHTML(j,'ar'+i,true)).join('')}</div>`;
}

function cardHTML(j,idx,isArchived){
  const tags=detectTags(j);
  const pt=payInfo(j), note=payNote(j);
  const sal=note||salaryStr(j);
  const remote=jobIsRemote(j);
  const best=j._score>=4&&!isArchived;
  const snip=(j.description||'').replace(/<[^>]+>/g,'').slice(0,280)+'…';
  const src=j.source==='adzuna'?'Adzuna':j.source==='reed'?'Reed':'Jooble';
  const dateStr=formatDate(j.created);
  const closes=closesInfo(j);

  const actionBtn=isArchived
    ?`<button class="btn-restore" onclick="event.stopPropagation();restore('${j.id}')">↩ Restore</button>`
    :`<button class="btn-dismiss" onclick="event.stopPropagation();dismiss('${j.id}')" title="Hide this job">✕</button>`;

  return `<div class="job-card${best?' best-match':''}${isArchived?' archived-card':''}" id="card-${idx}">
    <div class="card-main" onclick="toggleCard('${idx}')">
      <div class="card-top">
        <div><div class="card-title">${j.title}</div><div class="card-org">${j.org}</div></div>
        <div class="card-top-right">
          ${j._new&&!isArchived?'<span class="new-badge">New</span>':''}
          <span class="source-badge source-${j.source}">${src}</span>
          ${actionBtn}
        </div>
      </div>
      <div class="card-meta">
        <span class="meta-chip ${remote?'chip-remote':''}">
          <svg viewBox="0 0 12 12" fill="none"><path d="M6 1C3.24 1 1 3.24 1 6s2.24 5 5 5 5-2.24 5-5S8.76 1 6 1z" stroke="currentColor" stroke-width="1"/><path d="M1 6h10M6 1c-1.1 1.4-1.7 3-1.7 5s.6 3.6 1.7 5M6 1c1.1 1.4 1.7 3 1.7 5S7.1 9.6 6 11" stroke="currentColor" stroke-width="1"/></svg>
          ${remote?'Remote / WFH':j.location}
        </span>
        ${sal?`<span class="meta-chip chip-salary"><svg viewBox="0 0 12 12" fill="none"><rect x="1" y="2.5" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1"/><path d="M1 5h10" stroke="currentColor" stroke-width="1"/></svg>${sal}</span>`:''}
        ${!sal?'<span class="meta-chip chip-nosal">Salary not stated</span>':''}
        ${pt.partTime?`<span class="meta-chip chip-pt">Part-time${pt.hours?` · ${pt.hours} hrs/wk`:''}</span>`:''}
        ${closes&&!closes.expired?`<span class="meta-chip ${closes.cls}">${closes.text}</span>`:''}
        ${dateStr?`<span class="meta-chip chip-date">${dateStr}</span>`:''}
      </div>
      ${tags.length?`<div class="match-badges">${tags.map(t=>`<span class="match-badge badge-${t.type}">${t.label}</span>`).join('')}</div>`:''}
      <button class="card-expand-btn">View details <svg viewBox="0 0 13 13" fill="none"><path d="M2.5 4.5L6.5 8.5L10.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="card-detail">
      <p class="detail-snippet">${snip}</p>
      <a class="apply-link" href="${j.url}" target="_blank" rel="noopener">View full listing <svg viewBox="0 0 13 13" fill="none"><path d="M2.5 10.5L10.5 2.5M10.5 2.5H5.5M10.5 2.5V7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button class="apply-link letter-link" onclick="event.stopPropagation();writeLetter('${j.id}')">✍️ Write cover letter</button>
    </div>
  </div>`;
}

// "Searched 2h ago · Refresh" line, or live progress while a search is running
function agoText(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return'just now';if(m<60)return`${m} min ago`;const h=Math.round(m/60);return`${h} hour${h===1?'':'s'} ago`;}
function statusHTML(){
  const p=searchMeta.progress;
  if(searchMeta.running&&p){
    const part=(name,d,t)=>t?`${name} ${Math.min(d,t)}/${t}`:`${name} skipped`;
    return `<div class="search-status"><span class="spinner-sm"></span>Still searching · ${part('Reed',p.reed,p.reedTotal)} · ${part('Adzuna',p.adzuna,p.adzunaTotal)} · ${part('Jooble',p.jooble,p.joobleTotal)}</div>`;
  }
  if(!searchMeta.at)return'';
  const det=searchMeta.details?` · <span class="spinner-sm"></span>Reading full adverts ${searchMeta.details.done}/${searchMeta.details.total}`:'';
  return `<div class="search-status">${searchMeta.fromCache?'Saved results from':'Searched'} ${agoText(searchMeta.at)} · <a href="#" onclick="event.preventDefault();runSearch(true)">Refresh</a>${det}</div>`;
}

function toggleCard(idx){document.getElementById(`card-${idx}`)?.classList.toggle('expanded');}

// Hand a job over to the cover letter page
function writeLetter(id){
  const j=[...allJobs,...archived].find(x=>x.id===id);
  if(!j)return;
  const text=new DOMParser().parseFromString(j.description||'','text/html').body.textContent||''; // inert parse, strips tags
  const job={title:j.title,org:j.org,location:j.location,salary:salaryStr(j),url:j.url,description:text.trim(),full:!!j._full};
  try{localStorage.setItem('bubs_letter_job',JSON.stringify(job));}catch(e){}
  location.href='letters.html';
}

function jumpToGroup(role){
  const sel=document.getElementById('sort-select');
  const alreadyGrouped=sel&&sel.value==='group';
  if(!alreadyGrouped&&sel){sel.value='group';render();}
  const attempt=(tries)=>{
    const el=document.getElementById('group-'+role);
    if(el){
      el.scrollIntoView({behavior:'smooth',block:'start'});
      document.querySelectorAll('.group-pill').forEach(p=>p.classList.remove('active'));
      const pill=document.querySelector(`.group-pill[data-role="${role}"]`);
      if(pill){pill.classList.add('active');setTimeout(()=>pill.classList.remove('active'),1200);}
    } else if(tries>0){
      setTimeout(()=>attempt(tries-1),80);
    }
  };
  setTimeout(()=>attempt(5),30);
}

// Dark mode
function initDarkMode(){
  const saved=localStorage.getItem('bubs_dark');
  if(saved==='1'||(!saved&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
    document.documentElement.classList.add('dark');
    document.getElementById('dark-toggle').textContent='☀️';
  }
}
function toggleDark(){
  const isDark=document.documentElement.classList.toggle('dark');
  localStorage.setItem('bubs_dark',isDark?'1':'0');
  document.getElementById('dark-toggle').textContent=isDark?'☀️':'🌙';
}

function clearAll(){
  allJobs=[];archived=[];saveArchive();kv.set(CACHE_KEY,null);
  document.querySelectorAll('#role-toggles input').forEach(cb=>{cb.checked=false;});
  document.getElementById('results-area').innerHTML='<div class="empty-state"><div class="big">🔍</div><p>Toggle some role types and hit <strong>Search jobs</strong>.</p></div>';
  document.getElementById('debug-panel').innerHTML='';
}

window.addEventListener('DOMContentLoaded',()=>{initDarkMode();try{document.getElementById('include-nosal').checked=localStorage.getItem('bubs_include_nosal')==='1';}catch(e){}runSearch();});
</script>
